<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" fill="none" role="img" aria-label="Ansh Singh — building tools for AI coding agents">
  <defs>
    <linearGradient id="accent" x1="280" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#30363d"/>
    </pattern>
  </defs>

  <rect width="1000" height="200" fill="url(#dots)" opacity="0.55"/>

  <text x="500" y="82" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700" letter-spacing="10" fill="#e6edf3">ANSH SINGH</text>

  <rect x="280" y="106" width="440" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="500" y="148" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="17" letter-spacing="0.6" fill="#8b949e">building tools for AI coding agents</text>
</svg>
