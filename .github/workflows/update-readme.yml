name: Update README

on:
  schedule:
    - cron: "17 5 * * *" # daily, off the hour to avoid the top-of-hour rush
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/scripts/update-readme.mjs
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate auto sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node .github/scripts/update-readme.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh auto-generated README sections"
          # Another workflow may have pushed to main while this one ran.
          git pull --rebase --autostash origin main
          git push
